<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(120deg, #fceabb, #f8b500);
            margin: 0;
            padding: 0;
        }

        h1, h2 {
            text-align: center;
            color: #333;
            margin-top: 30px;
        }

        form {
            background-color: #ffffffcc;
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fff;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus {
            border-color: #f8b500;
            outline: none;
        }

        .btn {
            background-color: #f8b500;
            color: white;
            padding: 10px 20px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #d99900;
        }

        iframe {
            display: block;
            width: 95%;
            height: 400px;
            border: none;
            margin: 40px auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            background-color: white;
        }

        @media (max-width: 600px) {
            form {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <h1>Formulário de Contato</h1>

    <form action="enviar.php" method="POST">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required placeholder="Digite seu Nome">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required placeholder="Digite Seu Email">

        <label for="desc">Mensagem:</label>
        <textarea id="desc" name="desc" rows="5" required placeholder="Digite sua Mensagem aqui"></textarea>

        <input type="submit" value="Enviar" class="btn">
    </form>

    <h2>Contatos Recebidos</h2>
    <iframe src="listar.php"></iframe>

</body>
</html>
